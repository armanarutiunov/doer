[workspace]
members = ["core", "cli"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/armanarutiunov/doer"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.20"
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"
getrandom = "0.4.3"
ratatui = "0.30.2"
anyhow = "1.0.104"
dirs = "6.0.0"
insta = "1.48.0"
proptest = "1.11.0"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
string_slice = "deny"
expect_used = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"
debug = false
