name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-13, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          tar -czf "doer-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" doer
          shasum -a 256 "doer-${{ matrix.target }}.tar.gz" > "doer-${{ matrix.target }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: doer-${{ matrix.target }}
          path: |
            doer-${{ matrix.target }}.tar.gz
            doer-${{ matrix.target }}.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            doer-*.tar.gz
            doer-*.tar.gz.sha256
          generate_release_notes: true

      - name: Update Homebrew tap
        env:
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${GH_REF_NAME#v}"
          BASE="https://github.com/armanarutiunov/doer/releases/download/${GH_REF_NAME}"

          sha_of() { cut -d' ' -f1 < "doer-$1.tar.gz.sha256"; }
          ARM_MAC=$(sha_of aarch64-apple-darwin)
          X86_MAC=$(sha_of x86_64-apple-darwin)
          ARM_LINUX=$(sha_of aarch64-unknown-linux-gnu)
          X86_LINUX=$(sha_of x86_64-unknown-linux-gnu)

          git clone "https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/armanarutiunov/homebrew-doer.git" /tmp/tap
          cd /tmp/tap
          mkdir -p Formula

          cat > Formula/doer.rb << EOF
          class Doer < Formula
            desc "Vim-inspired TUI todo app"
            homepage "https://github.com/armanarutiunov/doer"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "${BASE}/doer-aarch64-apple-darwin.tar.gz"
                sha256 "${ARM_MAC}"
              else
                url "${BASE}/doer-x86_64-apple-darwin.tar.gz"
                sha256 "${X86_MAC}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "${BASE}/doer-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${ARM_LINUX}"
              else
                url "${BASE}/doer-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${X86_LINUX}"
              end
            end

            def install
              bin.install "doer"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/doer --version")
            end
          end
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/doer.rb
          git diff --cached --quiet || (git commit -m "doer ${VERSION}" && git push)
