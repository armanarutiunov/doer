[workspace]
# release-plz owns the version, the changelog and the tag. The tag is what the release
# workflow listens for, and that workflow owns the binaries, the GitHub release and the
# Homebrew formula -- so release-plz must not create the release itself.
git_release_enable = false
git_tag_name = "v{{ version }}"
# Flip to true once both crates exist on crates.io; until then release-plz refuses to
# diff a package the registry has never seen.
publish = false

[[package]]
name = "doer-core"
# One tag and one changelog per release, not one per crate: the two crates share a
# version and ship as a single binary.
git_tag_enable = false
changelog_update = false

[[package]]
name = "doer-tui"
changelog_path = "CHANGELOG.md"
